name: Build & Release Packed Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chromium for CRX Packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Setup Private Key from Secret (Optional)
        if: env.EXTENSION_PRIVATE_KEY != ''
        run: |
          echo "$EXTENSION_PRIVATE_KEY" > private_key.pem
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}

      - name: Build CRX and ZIP Packages
        run: |
          python build-package.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/adios.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
